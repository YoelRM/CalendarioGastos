<div class="year-view-container">
  <header class="main-header">
    <h1>Calendario Financiero {{ year }}</h1>
    <p>Selecciona un mes para gestionar tus finanzas.</p>
  </header>
  <div class="year-grid">
    <div *ngFor="let month of months; let i = index" class="mini-calendar" (click)="selectMonth(i)">
      <h3 class="month-title">
        <img [src]="month.icon" [alt]="'Icono de ' + month.name" class="month-icon">
        <span>{{ month.name }}</span>
      </h3>
    </div>
    </div>
</div>
