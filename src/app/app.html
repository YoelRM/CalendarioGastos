<main>
  <app-year-view
    *ngIf="currentView === 'year'"
    [year]="selectedYear"
    (monthSelected)="showMonth($event)">
  </app-year-view>

  <app-month-view
    *ngIf="currentView === 'month'"
    [year]="selectedYear"
    [month]="selectedMonth"
    (backToYear)="showYear()">
  </app-month-view>
</main>
<router-outlet></router-outlet>
